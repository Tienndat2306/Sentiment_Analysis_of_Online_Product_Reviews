# Cấu hình danh mục cho giai đoạn thu thập danh sách URL sản phẩm (Product Discovery)
# Phục vụ đề tài: Phân tích cảm xúc đánh giá sản phẩm trực tuyến (Tiki & Lazada)

settings:
  min_reviews: 10          # Chấp nhận mọi sản phẩm có từ 10 lượt đánh giá trở lên (không phân biệt rating cao/thấp)
  min_sold: 3              # Có ít nhất 10 lượt mua (> 0)
  max_pages_per_category: 3  # Quét sâu hơn (3 trang) để lấy được cả các sản phẩm có rating thấp (1-3 sao)
  delay_seconds: 0.4      # Độ trễ giữa các request
  output_file: "data/seeds/products.jsonl"

